    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxY5x3Ixl0vcAmaj2LN0UfOml9ZTXrQTn_3vfFdNmHs-N_9o7wmlDvoy2WUSHwvF1yM/exec';

        async function loadParticipants() {
            const response = await fetch(API_URL + "?action=list");
            const result = await response.json();

            if (!result.ok) {
                throw new Error('خطا در دریافت اطلاعات');
            }

            return result.data;
        }
        function getParticipantEditUrl(participant) {
            return (
                "/Participant/create.html?id=" +
                encodeURIComponent(participant.id)
            );
        }

        function renderParticipantsTable(items) {
            const tbody = document.getElementById('participants-table-body');

            if (!items || items.length === 0) {
                tbody.innerHTML = `
                      <tr>
                        <td colspan="3">داده‌ای وجود ندارد</td>
                      </tr>
                    `;
                return;
            }

            tbody.innerHTML = items.map(item => `
                    <tr>
                    <td data-label="Name">
                    <div class="d-flex py-1 align-items-center">
                        <span class="avatar avatar-2xl me-2" style="background-image: url(https://lh3.googleusercontent.com/d/${item['imageUrl'] ?? ''})"> </span>
                        <div class="flex-fill">
                            <div class="font-weight-medium">Thatcher Keel</div>
                            <div class="text-secondary"><a href="#" class="text-reset"><span class="__cf_email__" data-cfemail="8efae5ebebe2e8ceece2e1e9e9ebfca0ede1e3">[email&#160;protected]</span></a></div>
                        </div>
                    </div>
</td>
                      <td>${item['fullName'] ?? ''}
                       <a href="${getParticipantEditUrl(item) }" class="btn btn-sm btn-outline-primary">
        ویرایش
    </a>
                      
                      </td>
                      <td>${item['موبایل'] ?? ''}</td>
                      <td>${item['شهر'] ?? ''}</td>
                    </tr>
                  `).join('');
        }

        async function initPage() {
            try {
                const participants = await loadParticipants();
                renderParticipantsTable(participants);
            } catch (error) {
                console.error(error);
            }
        }

        initPage();

    </script>
