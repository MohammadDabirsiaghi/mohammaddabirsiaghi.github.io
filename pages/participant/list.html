    <style>
        #pagination {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

            #pagination button {
                min-width: 40px;
                height: 40px;
                padding: 0 12px;
                border: 1px solid #d0d7de;
                border-radius: 10px;
                background: #fff;
                color: #333;
                font-size: 14px;
                line-height: 1;
                cursor: pointer;
                transition: all 0.2s ease;
            }

                #pagination button:hover:not(:disabled) {
                    border-color: #0d6efd;
                    color: #0d6efd;
                    background: #f8fbff;
                }

                #pagination button.active {
                    background: #0d6efd;
                    border-color: #0d6efd;
                    color: #fff;
                    font-weight: 600;
                }

                #pagination button:disabled {
                    opacity: 0.5;
                    cursor: not-allowed;
                    background: #f5f5f5;
                }

            #pagination .pagination-ellipsis {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 24px;
                color: #888;
                font-size: 14px;
            }
    </style>
    <style>
        /* استایل‌های مربوط به تصویر و حالت بارگذاری (Skeleton Loading) */
        .participant-avatar-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #f2f4f7;
            flex-shrink: 0;
        }

        .participant-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .image-loading-placeholder {
            animation: pulse-placeholder 1.5s infinite ease-in-out;
            background-color: #e4e7eb;
        }

        @keyframes pulse-placeholder {
            0% {
                background-color: #e4e7eb;
            }

            50% {
                background-color: #f2f4f7;
            }

            100% {
                background-color: #e4e7eb;
            }
        }
    </style>
<style>
    .participant-card {
        display: flex;
        flex-direction: column;
        gap: 0.875rem;
    }

    .participant-media {
        display: flex;
        align-items: flex-start;
        gap: 0.875rem;
        min-width: 0;
    }

    .participant-avatar-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        flex: 0 0 auto;
    }

    .participant-identity {
        flex: 1 1 auto;
        min-width: 0;
    }

    .participant-name {
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.4;
        margin-bottom: 0.35rem;
    }

    .participant-contact,
    .participant-social {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0.75rem;
        margin-top: 0.35rem;
    }

    .participant-location {
        margin-top: 0.35rem;
    }

    .participant-meta-link,
    .participant-meta-text-wrap {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        min-width: 0;
        text-decoration: none;
        font-size: 0.875rem;
        color: var(--tblr-secondary);
    }

        .participant-meta-link:hover {
            color: var(--tblr-primary);
        }

    .participant-meta-icon {
        display: inline-flex;
        flex: 0 0 auto;
    }

    .participant-social-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
        color: var(--tblr-secondary);
        background: var(--tblr-bg-surface-secondary);
        text-decoration: none;
        transition: all 0.2s ease;
    }

        .participant-social-link:hover {
            color: var(--tblr-primary);
            background: var(--tblr-primary-lt);
        }

    .participant-main-body {
        display: grid;
        gap: 0.5rem;
    }

    .participant-project-row {
        font-size: 0.9375rem;
        line-height: 1.7;
        color: var(--tblr-body-color);
        padding: 0.5rem 0.75rem;
        background: var(--tblr-bg-surface-secondary);
        border-radius: var(--tblr-border-radius);
    }

    .participant-toggle {
        align-self: flex-start;
    }

    .participant-collapse {
        margin-top: -0.25rem;
    }

    .participant-collapse-body {
        padding: 0.875rem;
        border: 1px solid var(--tblr-border-color);
        border-radius: var(--tblr-border-radius);
        background: var(--tblr-bg-surface-secondary);
        display: grid;
        gap: 0.875rem;
    }

    .participant-block {
        display: grid;
        gap: 0.25rem;
    }

    .participant-block-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--tblr-muted);
    }

    .participant-block-value {
        font-size: 0.9375rem;
        line-height: 1.8;
        color: var(--tblr-body-color);
        white-space: pre-line;
    }

    @media (max-width: 767.98px) {
        .participant-item {
            padding-top: 0.875rem;
            padding-bottom: 0.875rem;
        }

        .participant-media {
            gap: 0.75rem;
        }

        .participant-avatar-wrap .btn {
            width: 100%;
            min-width: 0;
        }

        .participant-name {
            font-size: 0.95rem;
        }

        .participant-meta-link,
        .participant-meta-text-wrap,
        .participant-block-value,
        .participant-project-row {
            font-size: 0.8125rem;
        }

        .participant-mobile-secondary {
            display: none;
        }

        .participant-social-link {
            width: 1.85rem;
            height: 1.85rem;
        }

        .participant-collapse-body {
            padding: 0.75rem;
        }
    }

</style>
