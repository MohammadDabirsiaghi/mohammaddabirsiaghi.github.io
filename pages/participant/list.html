   <style>
       #pagination {
           display: flex;
           flex-wrap: wrap;
           align-items: center;
           justify-content: center;
           gap: 0.5rem;
           margin-top: 1rem;
       }

           #pagination button {
               min-width: 40px;
               height: 40px;
               padding: 0 12px;
               border: 1px solid #d0d7de;
               border-radius: 10px;
               background: #fff;
               color: #333;
               font-size: 14px;
               line-height: 1;
               cursor: pointer;
               transition: all 0.2s ease;
           }

               #pagination button:hover:not(:disabled) {
                   border-color: #0d6efd;
                   color: #0d6efd;
                   background: #f8fbff;
               }

               #pagination button.active {
                   background: #0d6efd;
                   border-color: #0d6efd;
                   color: #fff;
                   font-weight: 600;
               }

               #pagination button:disabled {
                   opacity: 0.5;
                   cursor: not-allowed;
                   background: #f5f5f5;
               }

           #pagination .pagination-ellipsis {
               display: inline-flex;
               align-items: center;
               justify-content: center;
               min-width: 24px;
               color: #888;
               font-size: 14px;
           }

   </style>
    <style>
        /* استایل‌های مربوط به تصویر و حالت بارگذاری (Skeleton Loading) */
        .participant-avatar-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #f2f4f7;
            flex-shrink: 0;
        }

        .participant-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .image-loading-placeholder {
            animation: pulse-placeholder 1.5s infinite ease-in-out;
            background-color: #e4e7eb;
        }

        @keyframes pulse-placeholder {
            0% {
                background-color: #e4e7eb;
            }

            50% {
                background-color: #f2f4f7;
            }

            100% {
                background-color: #e4e7eb;
            }
        }
    </style>
