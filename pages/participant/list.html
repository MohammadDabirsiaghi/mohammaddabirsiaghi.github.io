   <style>
       #pagination {
           display: flex;
           flex-wrap: wrap;
           align-items: center;
           justify-content: center;
           gap: 0.5rem;
           margin-top: 1rem;
       }

           #pagination button {
               min-width: 40px;
               height: 40px;
               padding: 0 12px;
               border: 1px solid #d0d7de;
               border-radius: 10px;
               background: #fff;
               color: #333;
               font-size: 14px;
               line-height: 1;
               cursor: pointer;
               transition: all 0.2s ease;
           }

               #pagination button:hover:not(:disabled) {
                   border-color: #0d6efd;
                   color: #0d6efd;
                   background: #f8fbff;
               }

               #pagination button.active {
                   background: #0d6efd;
                   border-color: #0d6efd;
                   color: #fff;
                   font-weight: 600;
               }

               #pagination button:disabled {
                   opacity: 0.5;
                   cursor: not-allowed;
                   background: #f5f5f5;
               }

           #pagination .pagination-ellipsis {
               display: inline-flex;
               align-items: center;
               justify-content: center;
               min-width: 24px;
               color: #888;
               font-size: 14px;
           }

   </style>
